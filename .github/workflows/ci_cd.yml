
# ============================================================
# Nom du workflow
# ============================================================
name: CI/CD Pipeline

# ============================================================
# Déclencheurs du workflow
# ============================================================
on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
# ============================================================
# Jobs : tâches à exécuter
# ============================================================
jobs:

  # ---------------------------------------------------------
  # JOB 1 : Tests
  # ---------------------------------------------------------
  test:
    # Machine Ubuntu fournie par GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer Python 3.12
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Installer les dépendances
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # 4. Vérifier la qualité et le style du code Python
      - name: Vérifier le style avec flake8
        run: |
          pip install flake8
          flake8 app.py --max-line-length=88

      # 5. Exécuter les tests
      - name: Lancer les tests
        run: pytest -q

  # ---------------------------------------------------------
  # JOB 2 : Build Docker
  # ---------------------------------------------------------
  build:
    # Ce job attend la réussite du job test
    needs: test
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Construire l'image Docker
      - name: Construire l'image Docker
        run: docker build -t myapp:${{ github.sha }} .

      # 3. Confirmer la construction
      - name: Confirmer le build
        run: echo "Image construite avec le tag myapp:${GITHUB_SHA}"
